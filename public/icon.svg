<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#grad)"/>
  
  <!-- Smartphone Outline -->
  <rect x="146" y="86" width="220" height="340" rx="36" fill="#0F172A" stroke="#FFFFFF" stroke-width="12" filter="url(#glow)"/>
  
  <!-- Screen Area -->
  <rect x="162" y="122" width="188" height="258" rx="16" fill="#1E293B"/>
  
  <!-- Notch -->
  <rect x="216" y="98" width="80" height="12" rx="6" fill="#334155"/>
  
  <!-- Chip / Tech Circuit Icon Inside -->
  <path d="M 236 190 L 276 190 L 276 230 L 236 230 Z" fill="#38BDF8"/>
  <circle cx="256" cy="250" r="30" fill="none" stroke="#60A5FA" stroke-width="8"/>
  <path d="M 256 220 L 256 170 M 256 280 L 256 330 M 226 250 L 176 250 M 286 250 L 336 250" stroke="#93C5FD" stroke-width="6" stroke-linecap="round"/>
  
  <!-- Home Indicator -->
  <rect x="216" y="398" width="80" height="8" rx="4" fill="#94A3B8"/>
</svg>
